[package]
name = "sue-paint"
description = "Sue Paint: the painting and illustration studio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license-file.workspace = true
# tests/golden.rs is a module of the crate itself (see the end of
# src/lib.rs): it reads the private file formats. Cargo must not also
# build it as a test crate of its own.
autotests = false

[dependencies]
egui.workspace = true
sue-ai.workspace = true
sue-core.workspace = true
sue-lang.workspace = true
sue-io.workspace = true
sue-model.workspace = true
sue-picture.workspace = true
sue-platform.workspace = true
sue-rice.workspace = true
sue-type.workspace = true
sue-wm.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Only the golden file generator uses it, to make a Sue Writer project
# the way Sue Writer does.
sue-writer.workspace = true
