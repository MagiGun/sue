[package]
name = "sue-picture"
description = "Sue's picture engine: layered pictures, compositing, brushes, selections, fills, filters and the other pixel work every studio that shows or edits a picture uses. No interface, no window, no studio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license-file.workspace = true

# The engine stands below every studio: it has no interface code of its
# own (no egui, no sue-wm; sue-type, which draws the story's text, brings
# them along) and never depends on a studio crate, so Sue Writer and the
# shell can show a picture without Sue Paint.
[dependencies]
sue-core.workspace = true
sue-io.workspace = true
sue-lang.workspace = true
sue-model.workspace = true
sue-platform.workspace = true
sue-type.workspace = true

[lints]
workspace = true
