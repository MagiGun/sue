[package]
name = "sue-platform"
description = "Sue's OS abstraction: platform hosts (headless and native winit/wgpu with egui), form factors, hardware capabilities, paths and unified input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license-file.workspace = true

[dependencies]
cpal.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
wgpu.workspace = true
winit.workspace = true

# The system clipboard, web links and the Linux display servers, everywhere
# but iOS, where the clipboard crate would build its Linux (Wayland and X11)
# side and cannot.
[target.'cfg(not(target_os = "ios"))'.dependencies]
egui-winit = { workspace = true, features = ["clipboard", "links", "wayland", "x11"] }

# The system clipboard, native dialogs, the opener and real-time audio
# threads exist on desktops only; phones and tablets go without them.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard.workspace = true
audio_thread_priority.workspace = true
open.workspace = true
rfd.workspace = true

# Android starts Sue as a native activity.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

[lints]
workspace = true
