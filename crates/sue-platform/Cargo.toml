[package]
name = "sue-platform"
description = "Sue's OS abstraction: platform hosts (headless and native winit/wgpu with egui), form factors, hardware capabilities, paths and unified input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license-file.workspace = true

[dependencies]
cpal.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
sys-locale.workspace = true
wgpu.workspace = true
winit.workspace = true

# HTTPS for Sue's own updates, everywhere but the browser, which is
# always the newest.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true

# The system clipboard, web links and the Linux display servers, everywhere
# but iOS, where the clipboard crate would build its Linux (Wayland and X11)
# side and cannot, and the browser, which has its own clipboard.
[target.'cfg(not(any(target_os = "ios", target_arch = "wasm32")))'.dependencies]
egui-winit = { workspace = true, features = ["clipboard", "links", "wayland", "x11"] }

# The system clipboard, native dialogs, the opener and real-time audio
# threads exist on desktops only; phones, tablets and the browser go
# without them.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
arboard.workspace = true
audio_thread_priority.workspace = true
open.workspace = true
rfd.workspace = true

# Android starts Sue as a native activity; the system's file pickers are
# reached in Java, through Sue's activity.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
winit = { workspace = true, features = ["android-native-activity"] }

# iOS's document picker, through the audited Objective-C calls in
# crates/sue-platform/ios.
[target.'cfg(target_os = "ios")'.dependencies]
sue-ios = { path = "ios" }

# Pen pressure from tablet drivers that speak WinTab (their Windows Ink is
# often off), through the driver's own wintab32.dll.
[target.'cfg(target_os = "windows")'.dependencies]
wintab.workspace = true
windows.workspace = true

# The browser: WebGPU with WebGL2 as the fallback, its page, storage,
# clipboard and file pickers, and a clock (std's panics there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-time.workspace = true
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardEvent",
    "console",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomException",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "KeyboardEvent",
    "PointerEvent",
    "MediaQueryList",
    "Navigator",
    "Url",
    "Window",
] }

[lints]
workspace = true
