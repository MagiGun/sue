[package]
name = "sue-android"
description = "Sue on Android: the native activity's entry, which hands Android's activity to sue-platform and runs Sue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "sue_android"
crate-type = ["cdylib"]

[dependencies]
sue = { path = "../../../bins/sue" }
sue-platform.workspace = true

# Android calls the app through one exported symbol, which Rust counts as
# unsafe: this crate (part of sue-platform, backbone rule 6) relaxes the
# workspace's `forbid` to `deny` so that one audited item may allow it.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
