# The four checks of the definition of done, on every system Sue ships
# for, plus builds for Android and iOS. Builds here are named after the
# latest release and the commits made since it, such as 0.0.1+dev.4, so
# they are never mistaken for the release itself (the Release workflow
# names its builds with the version typed).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          if tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            version="${tag#v}"
            since=$(git rev-list --count "$tag..HEAD")
            if [ "$since" != 0 ]; then version="$version+dev.$since"; fi
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1 | tr -d '\r')+dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

  checks:
    name: Checks (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libgtk-3-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Self-check
        run: cargo run -p sue -- --self-check

  android:
    name: Android build
    needs: version
    runs-on: ubuntu-24.04
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Toolchain and targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Package
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: python3 packaging/android/build_apk.py --abi arm64-v8a --abi x86_64

  ios:
    name: iOS build
    needs: version
    runs-on: macos-latest
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain and targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p sue --target aarch64-apple-ios

  # The Linux packages, built on every push to main so a broken package
  # shows before a release does.
  linux-packages:
    name: Linux packages
    if: github.event_name != 'pull_request'
    needs: version
    runs-on: ubuntu-22.04
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libgtk-3-dev rpm file desktop-file-utils
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/*

  arch-package:
    name: Arch package
    needs: [version, linux-packages]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: dist
      - run: packaging/arch/build.sh
      - name: Installs and runs
        run: |
          pacman -U --noconfirm dist/Sue-*-linux-x86_64.pkg.tar.zst
          sue --self-check

  flatpak:
    name: Flatpak
    needs: [version, linux-packages]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: dist
      - run: packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*.flatpak
