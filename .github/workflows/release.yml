# Builds every package for every system and publishes them as a GitHub
# release. Push a tag such as v0.0.1 to publish one; or run it by hand
# (Actions, Release, Run workflow) with a version, which makes a draft
# release whose tag is made at the commit it ran on once you publish it.
#
# The version typed (or the tag) names the release, every package and the
# version Sue reports; Cargo.toml's version is only for local builds.
#
# Android releases are signed with the key in the ANDROID_KEYSTORE secret
# (base64 of the keystore), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS;
# without them they are signed with a debug key. Windows programs and
# installers are signed with WINDOWS_CERTIFICATE (base64 of a .pfx) and
# WINDOWS_CERTIFICATE_PASSWORD when they are set, and unsigned (so Windows
# calls them "Unknown publisher") without them. macOS builds are signed
# with SUE_SIGN_IDENTITY when it is set (ad hoc otherwise); iOS packages
# are unsigned, to be signed with your own team. FreeBSD and RISC-V are
# newer: when one of them fails, the release goes out without it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The release's version, such as v0.0.1"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          GIVEN: ${{ inputs.version || github.ref_name }}
        run: |
          tag="$GIVEN"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  windows:
    name: windows (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: WiX, for the installers
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
      - name: Signing certificate, when the repository has one
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "sue.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
            "SUE_SIGN=/f `"$pfx`" /p `"$env:CERTIFICATE_PASSWORD`"" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
      - run: powershell -File packaging/windows/build.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.exe

  linux:
    name: linux (${{ matrix.runner }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # The oldest supported Ubuntu, so the packages run on older systems.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libgtk-3-dev rpm file desktop-file-utils
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*

  linux-riscv64:
    name: linux (riscv64)
    needs: version
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
      SUE_TARGET: riscv64gc-unknown-linux-gnu
      SUE_ARCH: riscv64
      STRIP: riscv64-linux-gnu-strip
      SKIP_APPIMAGE: "1"
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_LIBDIR: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add riscv64gc-unknown-linux-gnu
      - name: Cross compiler and RISC-V libraries
        run: |
          sudo dpkg --add-architecture riscv64
          # The runner's own sources (plain, mirror+file: or deb822) stay
          # amd64 only, since their mirrors have no RISC-V packages; those
          # come from Ubuntu's ports mirror.
          for list in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            if [ -f "$list" ]; then
              sudo sed -i -E '/^deb .*arch=/b; s/^deb \[/deb [arch=amd64 /; t; s/^deb /deb [arch=amd64] /' "$list"
            fi
          done
          for list in /etc/apt/sources.list.d/*.sources; do
            if [ -f "$list" ] && ! grep -q '^Architectures:' "$list"; then
              sudo sed -i '/^Types:/a Architectures: amd64' "$list"
            fi
          done
          printf 'deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports jammy main universe\ndeb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe\n' | sudo tee /etc/apt/sources.list.d/riscv64.list
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu libasound2-dev:riscv64 rpm
      - uses: Swatinem/rust-cache@v2
        with:
          key: riscv64
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-riscv64
          path: dist/*

  freebsd:
    needs: version
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          envs: SUE_VERSION
          usesh: true
          prepare: |
            pkg install -y curl pkgconf alsa-lib
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          run: |
            . "$HOME/.cargo/env"
            rustup toolchain install
            packaging/freebsd/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: freebsd
          path: dist/*.tar.gz

  macos:
    needs: version
    runs-on: macos-latest
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos/build.sh
        env:
          SUE_SIGN_IDENTITY: ${{ secrets.SUE_SIGN_IDENTITY }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip

  ios:
    needs: version
    runs-on: macos-latest
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: packaging/ios/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*

  android:
    needs: version
    runs-on: ubuntu-24.04
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_ARGS=--keystore $RUNNER_TEMP/release.keystore --alias ${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          fi
      - name: Package
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          SUE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: python3 packaging/android/build_apk.py --release $KEYSTORE_ARGS
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk

  arch:
    needs: [version, linux]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-ubuntu-*
          path: dist
          merge-multiple: true
      # The packages only repackage the tarballs, so one machine makes both.
      - run: |
          SUE_ARCH=x86_64 packaging/arch/build.sh
          SUE_ARCH=aarch64 packaging/arch/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: |
            dist/*.pkg.tar.zst
            dist/PKGBUILD

  flatpak:
    name: flatpak (${{ matrix.arch }})
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            linux: linux-ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
            linux: linux-ubuntu-22.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    env:
      SUE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.linux }}
          path: dist
      - run: packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*.flatpak

  publish:
    needs: [version, windows, linux, linux-riscv64, freebsd, macos, ios, android, arch, flatpak]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # sue.json: `scoop install` from the latest release's link.
      - name: Scoop manifest
        run: python3 packaging/scoop/manifest.py --tag ${{ needs.version.outputs.tag }} --dist dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Comes before the notes GitHub writes from the changes.
          body: |
            ## Installing

            **Windows:** `Sue-${{ needs.version.outputs.version }}-windows-x64-setup.exe` is the easiest (`x86` for 32-bit PCs, `arm64` for ARM ones). The `.msi` is the same installer for managed PCs, and the `-portable.zip` runs from any folder. Or install with [Scoop](https://scoop.sh):

            ```
            scoop install https://github.com/MagiGun/sue/releases/latest/download/sue.json
            ```

            Sue is not code-signed yet, so Windows may say "Windows protected your PC" or "Unknown publisher". Choose **More info**, then **Run anyway**. Before extracting the portable zip, right-click it, choose **Properties** and tick **Unblock**, or Windows asks again for every program inside. Scoop installs without the warning.

            **macOS:** the `.dmg`. **Linux:** the AppImage runs almost anywhere; there are also a Flatpak, `.deb`, `.rpm`, an Arch package and a tarball. **Android:** the `.apk`. **FreeBSD** and **iPhone and iPad** (to sign with your own Apple account) have packages too. More at https://magigun.github.io/sue/.
          # A tag push names the release; a run by hand names it with its
          # version and tags the commit it ran on.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          name: Sue ${{ needs.version.outputs.tag }}
