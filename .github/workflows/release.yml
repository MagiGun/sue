# Builds every package for every system and publishes them as a GitHub
# release. Push a tag such as v1.0.0, or run it by hand for a draft.
#
# Android releases are signed with the key in the ANDROID_KEYSTORE secret
# (base64 of the keystore), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS;
# without them they are signed with a debug key. macOS builds are signed
# with SUE_SIGN_IDENTITY when it is set (ad hoc otherwise); iOS packages
# are unsigned, to be signed with your own team.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: powershell -File packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: linux (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # The oldest supported Ubuntu, so the AppImage runs on older systems.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libgtk-3-dev rpm file desktop-file-utils
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos/build.sh
        env:
          SUE_SIGN_IDENTITY: ${{ secrets.SUE_SIGN_IDENTITY }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: packaging/ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_ARGS=--keystore $RUNNER_TEMP/release.keystore --alias ${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          fi
      - name: Package
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          SUE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: python3 packaging/android/build_apk.py --release $KEYSTORE_ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-ubuntu-22.04
          path: dist
      - run: packaging/arch/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: |
            dist/*.pkg.tar.zst
            dist/PKGBUILD

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-ubuntu-22.04
          path: dist
      - run: packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak

  publish:
    needs: [windows, linux, macos, ios, android, arch, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          name: Sue ${{ github.ref_name }}
