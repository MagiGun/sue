[workspace]
resolver = "3"
members = ["crates/*", "crates/sue-platform/android", "crates/sue-platform/ios", "bins/*"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.95"
publish = false
repository = "https://github.com/MagiGun/sue"
license-file = "LICENSE"

[workspace.dependencies]
sue-core = { path = "crates/sue-core" }
sue-platform = { path = "crates/sue-platform" }
sue-rice = { path = "crates/sue-rice" }
sue-io = { path = "crates/sue-io" }
sue-pkg = { path = "crates/sue-pkg" }
sue-ai = { path = "crates/sue-ai" }
sue-wm = { path = "crates/sue-wm" }
sue-model = { path = "crates/sue-model" }
sue-paint = { path = "crates/sue-paint" }
sue-type = { path = "crates/sue-type" }
sue-writer = { path = "crates/sue-writer" }
sue-lang = { path = "crates/sue-lang" }

ed25519-dalek = "3"
semver = "1"
sha2 = "0.11"

# The language database: Project Fluent messages, and the system's
# language on first start.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
intl-memoizer = "0.5"
sys-locale = "0.3"
unic-langid = "0.9"

# Phase 3: native window, GPU and JPEG XL.
jxl-oxide = "0.12"
pollster = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
winit = "0.30"
zune-core = "0.5"
zune-jpegxl = "0.5"
bytemuck = "1"

# Workstation shell: audio output, more codecs, native dialogs.
audio_thread_priority = { version = "0.33", default-features = false }
cpal = "0.16"
open = "5"
rfd = "0.17"
symphonia = { version = "0.5", default-features = false, features = ["aac", "aiff", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
zune-jpeg = "0.5"
zune-png = "0.5"

# The egui shell: widgets, winit input, wgpu painting and the clipboard.
arboard = { version = "3.6", default-features = false }
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
# Its clipboard, links, Wayland and X11 are switched on per system in
# sue-platform: iOS has none of them.
egui-winit = { version = "0.37", default-features = false }
jpeg-encoder = "0.7"

# The system's own file pickers on phones and tablets: Java's (JNI) on
# Android and UIKit's on iOS, the versions winit and cpal already use.
# Blocks and CoreGraphics' rectangles watch iOS's on-screen keyboard.
block2 = { version = "0.6", default-features = false }
jni = "0.21"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-ui-kit = { version = "0.3", default-features = false }

# The browser: its window, storage, clipboard, file pickers and clock,
# the versions winit and wgpu already use.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
web-time = "1"

# Typography and publishing: reading installed fonts, the deflate inside
# DOCX, EPUB, ODT and PDF files, and regular expressions in find.
miniz_oxide = "0.8"
ttf-parser = "0.25"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

# The converter: more picture formats in and out, and FLAC out.
flacenc = { version = "0.5", default-features = false }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "png", "pnm", "qoi", "tga", "tiff", "webp"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"

# The browser build (packaging/web/build.sh): smaller over faster, since
# the whole program is downloaded before Sue opens.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# Codecs, the GPU stack and the audio backend are far too slow unoptimized;
# Sue's own crates stay at the default debug level for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

# Sue Paint's pixel loops and the blend math they call run for every pixel
# on every change; unoptimized, painting and layer edits would stutter.
[profile.dev.package.sue-paint]
opt-level = 3

[profile.dev.package.sue-model]
opt-level = 3
