[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/uvxszi/Sue"

[workspace.dependencies]
sue-core = { path = "crates/sue-core" }
sue-platform = { path = "crates/sue-platform" }
sue-rice = { path = "crates/sue-rice" }
sue-io = { path = "crates/sue-io" }
sue-pkg = { path = "crates/sue-pkg" }
sue-ai = { path = "crates/sue-ai" }
sue-wm = { path = "crates/sue-wm" }

ed25519-dalek = "3"
semver = "1"
sha2 = "0.11"

# Phase 3: native window, GPU, text and JPEG XL.
epaint_default_fonts = "0.33"
fontdue = "0.9"
jxl-oxide = "0.12"
pollster = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
winit = "0.30"
zune-core = "0.5"
zune-jpegxl = "0.5"
bytemuck = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
