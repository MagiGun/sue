[package]
name = "sue"
description = "Sue, the Singular Unified Engine: opens its window, or runs its self-check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license-file.workspace = true
# `sue` opens the window (and, built for release on Windows, no console);
# `sue-cli` is the same program for a terminal: --self-check, --version.
default-run = "sue"

[dependencies]
egui.workspace = true
sue-ai.workspace = true
sue-core.workspace = true
sue-io.workspace = true
sue-lang.workspace = true
sue-model.workspace = true
sue-paint.workspace = true
sue-pkg.workspace = true
sue-platform.workspace = true
sue-rice.workspace = true
sue-type.workspace = true
sue-wm.workspace = true
sue-writer.workspace = true

[lints]
workspace = true
